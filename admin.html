<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brainfield Admin — Content Manager</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

<!-- LOGIN -->
<div id="loginView" class="admin-login">
  <form id="loginForm" class="admin-login-card">
    <img src="assets/img/brainfield-consult-logo.png" alt="Brainfield" class="admin-login-logo">
    <h1>Admin sign in</h1>
    <p class="small">Sign in to edit the Brainfield website content.</p>
    <label>Email
      <input type="email" id="loginEmail" required autocomplete="username">
    </label>
    <label>Password
      <input type="password" id="loginPassword" required autocomplete="current-password">
    </label>
    <button type="submit" class="btn btn-primary btn-block">Sign in</button>
    <p id="loginError" class="admin-error" hidden></p>
  </form>
</div>

<!-- DASHBOARD -->
<div id="dashboardView" class="admin-shell" hidden>
  <header class="admin-topbar">
    <span class="admin-brand">Brainfield Admin</span>
    <div class="admin-topbar-right">
      <span id="userEmail" class="small"></span>
      <button id="logoutBtn" class="btn btn-ghost btn-sm">Log out</button>
    </div>
  </header>
  <div class="admin-body-grid">
    <nav class="admin-sidebar" id="adminNav"></nav>
    <main class="admin-main" id="adminMain"></main>
  </div>
</div>

<div id="toast" class="admin-toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/cms-config.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
